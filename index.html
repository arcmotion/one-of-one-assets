<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand files</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<noscript>This page needs JavaScript to show the download links.</noscript>
<div class="notice" data-notice hidden><div class="wrap" data-copy="notice"></div></div>
<header class="bar"><div class="wrap">
  <a href="#top" data-brand-link><img data-bar-logo alt=""></a>
  <nav aria-label="Sections">
    <a href="#logo" data-nav="logo" data-copy="logo.title"></a>
    <a href="#favicon" data-nav="favicon" data-copy="favicon.title"></a>
    <a href="#brandbook" data-nav="brandbook" data-copy="brandbook.title"></a>
    <a href="#more-files" data-nav="external" data-copy="external.title"></a>
  </nav>
</div></header>

<main id="top">
  <div class="hero"><div class="wrap">
    <div data-hero-media></div>
    <h1 data-copy="hero.title"></h1>
    <p data-copy="hero.lead"></p>
    <a class="btn solid" data-hero-download></a>
  </div></div>

  <section id="logo" data-section="logo"><div class="wrap">
    <h2 data-copy="logo.title"></h2>
    <p class="lead" data-copy="logo.lead"></p>
    <div class="logo-tool">
      <div class="controls">
        <fieldset data-versions><legend data-copy="logo.version"></legend><p class="hint" data-version-hint></p></fieldset>
        <fieldset data-colours><legend data-copy="logo.colour"></legend><p class="hint" data-colour-hint></p></fieldset>
      </div>
      <div class="stage" data-stage><img alt=""></div>
      <div class="after">
        <ul class="files" data-formats></ul>
        <div class="help" data-guides></div>
        <p class="more"><a class="btn" data-logo-download></a></p>
      </div>
    </div>
  </div></section>

  <section id="favicon" data-section="favicon"><div class="wrap">
    <h2 data-copy="favicon.title"></h2>
    <p class="lead" data-copy="favicon.lead"></p>
    <div class="tabs" aria-hidden="true" data-tabs></div>
    <div class="actions" style="margin-bottom:32px" data-favicon-downloads></div>
    <div class="table-scroll"><table class="sizes"><thead><tr data-favicon-head></tr></thead><tbody data-favicon-rows></tbody></table></div>
    <div data-home-screen>
      <h3 data-copy="favicon.homeTitle"></h3>
      <p class="note" data-copy="favicon.homeNote"></p>
      <div class="touch" data-home-icons></div>
    </div>
  </div></section>

  <section id="brandbook" class="book" data-section="brandbook"><div class="wrap">
    <img data-cover alt="">
    <div>
      <h2 data-copy="brandbook.title"></h2>
      <p class="lead" data-copy="brandbook.lead"></p>
      <div class="actions" data-brandbook-actions></div>
    </div>
  </div></section>

  <section id="more-files" data-section="external"><div class="wrap">
    <h2 data-copy="external.title"></h2>
    <p class="lead" data-copy="external.lead"></p>
    <div data-external></div>
    <p class="more"><a data-folder-link target="_blank" rel="noopener"></a></p>
  </div></section>
</main>

<footer><div class="wrap" data-footer></div></footer>

<template id="format-row"><li><span class="fmt"></span><span class="use"><span data-use></span><small></small></span><a class="btn"></a></li></template>
<template id="external-row"><div class="reel"><figure hidden></figure><div><h3></h3><p class="note"></p><div class="actions"><a class="btn solid"></a></div></div></div></template>
<script src="app.js" defer></script>
</body>
</html>
